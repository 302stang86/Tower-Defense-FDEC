<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f1c">
<title>Switchback Defense</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout concept: HUD strip on top, scaled playfield in the middle, thumb-sized controls below
   (portrait phone), or controls in a right-hand column (short landscape screens). */
:root {
  --bg: #0d1114;
  --panel: #141a1f;
  --line: #25303a;
  --ground: #0f1519;
  --grid: rgba(120, 150, 175, 0.07);
  --track: #27313a;
  --track-edge: #3a4857;
  --text: #e6edf3;
  --muted: #8b9aa9;
  --gold: #ffc83d;
  --life: #ff6b6b;
  --tower: #4aa8ff;
  --tower2: #3ddc97;
  --beam: #7df9ff;
  --enemy: #ff4d4d;
  --boss: #ffd23f;
  --ember: #ff8a3d;
  --btn: #1b242c;
  --btn-hi: #26333e;
  --display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }
.hud { grid-area: hud; display: flex; align-items: center; gap: 12px; padding-top: 8px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; color: var(--muted); display: none; }
.stats { display: flex; gap: 16px; align-items: baseline; flex: 1; min-width: 0; flex-wrap: wrap; }
.stat { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat small { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; }
.stat b { font-size: 22px; font-weight: 700; }
#sGold b { color: var(--gold); }
#sLives b { color: var(--life); }
.status { font-size: 13px; color: var(--muted); width: 100%; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 6px; }
.tool { min-width: 52px; min-height: 40px; padding: 0 10px; background: var(--btn); border: 1px solid var(--line); border-radius: 6px; font-family: var(--display); font-weight: 600; font-size: 14px; cursor: pointer; }
.tool:hover { background: var(--btn-hi); }
.stage { grid-area: stage; position: relative; flex: 1; min-height: 0; overflow: hidden; }
#field { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 1px solid var(--line); border-radius: 4px; touch-action: none; display: block; background: var(--ground); }
.bar { grid-area: bar; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.info { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.info .txt { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
.info .txt b { color: var(--text); font-family: var(--display); font-weight: 600; }
.link { background: none; border: 0; color: var(--tower); font-weight: 600; cursor: pointer; padding: 8px; }
.btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { min-height: 58px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--btn); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.act:hover:not(:disabled) { background: var(--btn-hi); }
.act .l { font-family: var(--display); font-weight: 700; font-size: 15px; }
.act .s { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.act:disabled { opacity: 0.4; cursor: default; }
.act.on { border-color: var(--tower); box-shadow: inset 0 0 0 1px var(--tower); }
#bSell .l { color: #ff9a9a; }
#bUp .l { color: var(--tower2); }
#bBuild .l { color: var(--tower); }
button:focus-visible { outline: 2px solid var(--beam); outline-offset: 2px; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 11, 14, 0.82); padding: 16px; z-index: 5; }
.card { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.card h1 { margin: 0; font-family: var(--display); font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.45; font-size: 15px; }
.card ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 6px; line-height: 1.4; }
.card .big { font-family: var(--display); font-size: 40px; font-weight: 700; color: var(--text); }
.go { min-height: 52px; background: var(--tower); color: #06121f; border: 0; border-radius: 8px; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
.go.alt { background: var(--btn); color: var(--text); border: 1px solid var(--line); }
.picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pk { min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--btn); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 13px; }
.pk small { font-size: 12px; color: var(--muted); font-weight: 500; }
.pk.on { border-color: var(--ember); box-shadow: inset 0 0 0 1px var(--ember); }
/* Codex */
.dexov { position: fixed; inset: 0; z-index: 30; background: rgba(9, 12, 15, 0.97); display: flex; flex-direction: column; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.dexhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dexhead h2 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; }
.dexbody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.dexbody h3 { margin: 0; font-family: var(--display); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.dcard { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.dcard.boss { border-color: #5a2424; }
.dcard.locked { opacity: 0.55; }
.dcard canvas { flex: none; width: 88px; height: 88px; background: var(--ground); border-radius: 6px; }
.dtxt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dname { font-family: var(--display); font-weight: 700; font-size: 16px; }
.drole { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ember); }
.dstats { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.ddesc { font-size: 13px; color: var(--muted); line-height: 1.35; }
.dplay { font-size: 13px; color: var(--tower); line-height: 1.3; }
@media (min-width: 700px) { .brand { display: block; } .hud { flex-wrap: nowrap; } .status { width: auto; } }
@media (orientation: landscape) and (max-height: 520px) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) 210px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "hud hud" "stage bar"; column-gap: 12px; }
  .bar { justify-content: flex-end; }
  .btns { grid-template-columns: 1fr 1fr; }
  .act { min-height: 50px; }
  .hud { flex-wrap: nowrap; }
  .status { width: auto; }
  .card { padding: 16px; gap: 10px; }
  .card h1 { font-size: 22px; }
}

.cameraHint { position:absolute;bottom:7px;left:10px;right:10px;text-align:center;font-size:11px;color:#c2d4dd;pointer-events:none;text-shadow:0 1px 3px #000; }
#field { cursor:grab; }
/* Author display:flex/grid rules must never override the HTML hidden state. */
[hidden] { display: none !important; }

/* Isometric art direction: ink-blue command panels and warm brass accents. */
body { margin:0; background:radial-gradient(ellipse at 50% 15%,#23334c 0%,#101929 52%,#080f1c 100%); }
#stage { background:radial-gradient(ellipse at 50% 55%,#24394d 0%,#101c30 60%,#0b1322 100%); border:1px solid #3b526e; border-radius:16px; box-shadow:inset 0 0 70px #03091688,0 12px 30px #0005; }
.tool,.act,.pk { background:linear-gradient(145deg,#26394e,#152338); border-color:#425770; box-shadow:inset 0 1px #ffffff0d,0 3px 7px #0003; }
.go { background:linear-gradient(120deg,#87e7ee,#51acdf); box-shadow:0 0 22px #4aafff22; }

/* ---- Mobile friendliness: no double-tap or pinch zoom, no rubber-banding, dynamic viewport height,
   notch-safe edges, comfortable touch targets ---- */
html { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { height: 100%; height: 100dvh; max-height: 100dvh; overscroll-behavior: none; -webkit-touch-callout: none; touch-action: manipulation; }
button, .act, .tool, .pk, .go, .link { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#field, .cameraHint { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.dexbody, .card { overscroll-behavior: contain; touch-action: pan-y; }
.hud { padding-top: max(8px, env(safe-area-inset-top, 0px)); }
.bar { padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.tool { min-height: 44px; }
.link { min-height: 44px; min-width: 44px; }
@media (hover: none) and (pointer: coarse) {
  .tool:hover, .act:hover:not(:disabled) { background: inherit; }
  .act { min-height: 62px; }
  .pk { min-height: 48px; }
}
@media (max-width: 420px) {
  body { gap: 6px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .stats { gap: 10px; }
  .stat b { font-size: 19px; }
  .tool { min-width: 44px; padding: 0 8px; font-size: 13px; }
  .tools { gap: 4px; }
  .card { padding: 16px; }
  .card h1 { font-size: 24px; }
  .cameraHint { font-size: 10px; left: 6px; right: 6px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .hud { padding-top: max(4px, env(safe-area-inset-top, 0px)); }
  .bar { padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
}

/* Compact two-row HUD on phones: stats on top, status + buttons below; footer never overflows */
.info .txt { flex: 1 1 0; min-width: 0; }
.link { flex: none; }
@media (max-width: 699px) {
  .stats { flex: 1 1 100%; flex-wrap: nowrap; gap: 14px; }
  .status { flex: 1 1 0; min-width: 0; width: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { flex: none; }
  .hud { gap: 4px 10px; }
}
@media (max-width: 420px) {
  .stat small { font-size: 9px; letter-spacing: 0.08em; }
  .stat b { font-size: 18px; }
}
@media (max-height: 700px) and (orientation: portrait) {
  .act { min-height: 52px; padding: 4px 2px; }
  .act .l { font-size: 14px; }
  .act .s { font-size: 12px; }
  .info { min-height: 34px; font-size: 13px; }
  .pk { min-height: 42px; }
  .bar { gap: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
  .cameraHint { display: none; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .hud { flex-wrap: nowrap; }
  .stats { flex: 1 1 auto; }
}
</style>
</head>
<body>
<header class="hud">
  <div class="brand">Switchback</div>
  <div class="stats">
    <div class="stat" id="sGold"><small>GOLD</small><b id="vGold">250</b></div>
    <div class="stat" id="sLives"><small>LIVES</small><b id="vLives">20</b></div>
    <div class="stat"><small>WAVE</small><b id="vWave">0</b></div>
  </div>
  <div class="status" id="vStatus"></div>
  <div class="tools">
    <button class="tool" id="bDex">Codex</button>
    <button class="tool" id="bSpeed" aria-label="Game speed">1×</button>
    <button class="tool" id="bPause">Pause</button>
  </div>
</header>

<div class="stage" id="stage">
  <canvas id="field" aria-label="Tower defense playfield. Drag to pan; tap to select or build."></canvas>
  <div class="cameraHint">Drag to pan · Tap to select · Red edge = playable field</div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
</div>

<footer class="bar">
  <div class="info"><span class="txt" id="vInfo"></span><button class="link" id="bCancel" hidden>Cancel</button></div>
  <div class="picker" id="picker" hidden></div>
  <div class="btns">
    <button class="act" id="bBuild"><span class="l">Build</span><span class="s" id="sBuild">$100</span></button>
    <button class="act" id="bUp"><span class="l">Upgrade</span><span class="s" id="sUp">$70</span></button>
    <button class="act" id="bSell"><span class="l">Sell</span><span class="s" id="sSell">select tower</span></button>
    <button class="act" id="bNext"><span class="l">Send wave</span><span class="s" id="sNext">now</span></button>
  </div>
</footer>

<div class="dexov" id="dexOv" hidden>
  <div class="dexhead"><h2>Codex</h2><button class="tool" id="dexClose">Close</button></div>
  <div class="dexbody" id="dexBody"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const cv = $('field'), ctx = cv.getContext('2d'), stage = $('stage');
  const css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim();
  const C = {
    ground: col('--ground'), grid: col('--grid'), track: col('--track'), edge: col('--track-edge'),
    tower: col('--tower'), tower2: col('--tower2'), beam: col('--beam'), enemy: col('--enemy'),
    boss: col('--boss'), gold: col('--gold'), text: col('--text'), life: col('--life')
  };
  const CELL = 50, MAP_COLS = 20, MAP_ROWS = 10; // 200 tiles: 25% more area than the original 160 tiles
  // Sci-fi base sectors: each has a maze route (corner cells [col,row] in landscape) and a colour scheme.
  // One is picked at random every game. Enemies walk cell centres; towers snap to free cells.
  const SECTORS = [
    { name: 'Reactor Deck', acc: '#35e0ff', deep: '#0b1519', mid: '#16262c', lite: '#27414b',
      corners: [[0, 1], [5, 1], [5, 3], [2, 3], [2, 5], [7, 5], [7, 2], [9, 2], [9, 7], [4, 7], [4, 9], [12, 9], [12, 4], [15, 4]] },
    { name: 'Cryo Labs', acc: '#9ad4ff', deep: '#0d1219', mid: '#1a2430', lite: '#2d3d52',
      corners: [[15, 1], [11, 1], [11, 4], [14, 4], [14, 7], [8, 7], [8, 3], [5, 3], [5, 8], [2, 8], [2, 5], [0, 5]] },
    { name: 'Hangar Bay', acc: '#ffb13d', deep: '#17130d', mid: '#2a241a', lite: '#4a3f2b',
      corners: [[0, 4], [3, 4], [3, 1], [7, 1], [7, 4], [5, 4], [5, 7], [10, 7], [10, 3], [13, 3], [13, 8], [15, 8]] },
    { name: 'Bio-Dome Core', acc: '#6dff9a', deep: '#0c1511', mid: '#17261d', lite: '#26402f',
      corners: [[0, 8], [13, 8], [13, 6], [3, 6], [3, 4], [10, 4], [10, 2], [1, 2], [1, 0], [15, 0]] }
  ];
  let SECTOR = SECTORS[0], MAP = [], PATHSET = new Set();
  function setSector(i) {
    SECTOR = SECTORS[i];
    const cs = SECTOR.corners.map(([col,row]) => [Math.round(col * (MAP_COLS-1) / 15), row]);
    MAP = cs.map(([c, r]) => [c * CELL + CELL / 2, r * CELL + CELL / 2]);
    PATHSET = new Set();
    for (let k = 0; k < cs.length - 1; k++) {
      const a = cs[k], b = cs[k + 1], dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]);
      for (let x = a[0], y = a[1]; ; x += dx, y += dy) { PATHSET.add(x + ',' + y); if (x === b[0] && y === b[1]) break; }
    }
  }
  setSector(0);
  const TRACK_W = 30, TOWER_R = 18, BUILD_COST = 100, UP_COST = 70, STEP = 1000 / 60, TILE = 30, TAU = Math.PI * 2;
  const SPW = { 'Very Slow': 0.55, 'Slow': 0.85, 'Normal': 1.2, 'Fast': 1.7, 'Very Fast': 2.3 };

  /* ---------- Codex data: 30 standard units ---------- */
  // from = first wave the unit can appear. spd is the codex speed value. play = how it behaves in this game.
  const UNITS = [
    { id: 'ember_sprite', name: 'Ember Sprite', role: 'Fast Scout / Burner', hp: 120, dmg: 15, range: 2.5, spd: 3.2, sw: 'Fast', from: 1, r: 10, gap: 22, fly: 1,
      desc: 'Low health flying unit that dashes ahead to ignite frontline targets.', play: 'Flies a shortcut across the field.',
      base: 'orb', art: { a: '#ff8a2a', b: '#c43d12', c: '#ffe08a', wings: 1 } },
    { id: 'flame_scout', name: 'Flame Scout', role: 'Ranged Harasser', hp: 150, dmg: 22, range: 4.0, spd: 2.8, sw: 'Fast', from: 4, r: 11,
      desc: 'Fires small heat darts from a distance to bypass heavy armor.',
      base: 'person', art: { a: '#b8431c', b: '#5a1d0e', c: '#ffb347', gears: ['hood', 'dart'] } },
    { id: 'magma_grunt', name: 'Magma Grunt', role: 'Tanky Brawler', hp: 400, dmg: 35, range: 1.0, spd: 1.2, sw: 'Slow', from: 2, r: 15, gap: 50,
      desc: 'Sturdy frontline brute made of cooled basalt and molten core.',
      base: 'brute', art: { a: '#4a3530', b: '#2b1d1a', c: '#ff7a2e', gears: ['cracks', 'plates'] } },
    { id: 'cinder_walker', name: 'Cinder Walker', role: 'Ambush Unit', hp: 220, dmg: 40, range: 1.2, spd: 2.0, sw: 'Normal', from: 6, r: 12, burrow: 1,
      desc: 'Burrows underneath towers before erupting with a surprise burst.', play: 'Burrows and cannot be shot while underground.',
      base: 'person', art: { a: '#6a4a3a', b: '#3a2820', c: '#ff9d4d', gears: ['hood', 'claws'] } },
    { id: 'blaze_archer', name: 'Blaze Archer', role: 'Sniper Unit', hp: 180, dmg: 55, range: 6.5, spd: 1.8, sw: 'Normal', from: 7, r: 12,
      desc: 'Pulls back a bow of pure flame to pick off tower defenses from afar.', play: 'Outranges a basic tower. Upgrade range to answer it.',
      base: 'person', art: { a: '#c4561f', b: '#6a2410', c: '#ffd45e', gears: ['bow'] } },
    { id: 'ash_mage', name: 'Ash Mage', role: 'Area Debuffer', hp: 160, dmg: 28, range: 4.5, spd: 1.7, sw: 'Normal', from: 15, r: 12, blind: 1,
      desc: 'Casts blinding ash clouds that temporarily disable tower targeting range.', play: 'Ash clouds blind every tower in reach.',
      base: 'person', art: { a: '#7c7872', b: '#4a4642', c: '#ffb85e', robe: 1, gears: ['hat', 'staff'] } },
    { id: 'igniter_brute', name: 'Igniter Brute', role: 'Siege Breaker', hp: 550, dmg: 60, range: 1.0, spd: 0.9, sw: 'Very Slow', from: 13, r: 17, gap: 60,
      desc: 'Carries a heavy forge hammer that deals massive bonus damage to walls.',
      base: 'brute', art: { a: '#5a3a2e', b: '#2f1d17', c: '#ff6a1f', gears: ['hammer', 'plates'] } },
    { id: 'pyro_knight', name: 'Pyro Knight', role: 'Shield Vanguard', hp: 480, dmg: 30, range: 1.5, spd: 1.5, sw: 'Normal', from: 8, r: 13, armor: 0.3,
      desc: 'Equipped with a heat-absorbent shield that blocks front tower projectiles.', play: 'Shield takes 30% off every hit.',
      base: 'person', art: { a: '#9a3a1c', b: '#52200f', c: '#ffc04d', m: '#a9a6a0', gears: ['helm', 'shield'] } },
    { id: 'fire_wisp', name: 'Fire Wisp', role: 'Fast Distraction', hp: 80, dmg: 10, range: 1.0, spd: 4.0, sw: 'Very Fast', from: 1, r: 8, gap: 14,
      desc: 'Extremely swift, easily swarmed in groups to absorb single-target tower ammo.',
      base: 'orb', art: { a: '#ffb347', b: '#ff6a1f', c: '#fff1b8' } },
    { id: 'lava_hound', name: 'Lava Hound', role: 'Chaser', hp: 250, dmg: 45, range: 1.0, spd: 2.6, sw: 'Fast', from: 5, r: 12, prefer: 'weak',
      desc: 'Hunts down the weakest player towers and leaves a trail of burning embers.', play: 'Targets your lowest-level tower.',
      base: 'beast', art: { a: '#8a2c14', b: '#4a1409', c: '#ff8a2e', gears: ['mane'] } },

  function shade(hex,k) {

    if (G.item && G.started && !G.paused && !G.over && !codexOpen && (G.item.left -= dt) <= 0) G.item = null; // real time, ignores game speed
    if (G.started && !G.paused && !G.over && !codexOpen) {
      acc += dt * G.speed * GAME_PACE;
      while (acc >= STEP && !G.over) { tick(); acc -= STEP; }
    } else acc = 0;
    draw(); updateHud();
    requestAnimationFrame(frame);
  }
  reset(); layout(); showIntro();
  requestAnimationFrame(frame);
})();
</script>
